<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BATUKARAS MEDIA — Reservasi Wisata</title>
<meta name="description" content="Reservasi wisata Batukaras Media melalui WhatsApp.">
<style>
:root{--blue:#0877c9;--light:#dff3ff;--white:#fff;--text:#123044}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(160deg,#e9f8ff,#fff);color:var(--text)}
.wrap{max-width:720px;margin:auto;padding:24px 16px 40px}
.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 12px 35px rgba(8,119,201,.13);border:1px solid #d8eefb}
.logo{width:92px;height:92px;object-fit:cover;border-radius:20px;display:block;margin:0 auto 14px}
h1{text-align:center;color:var(--blue);margin:0;font-size:30px} .sub{text-align:center;color:#557080;margin:7px 0 25px}
label{font-weight:700;display:block;margin:15px 0 7px}
input,select{width:100%;padding:14px;border:1px solid #b9dceb;border-radius:12px;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #dff3ff}
button{width:100%;border:0;border-radius:14px;padding:16px;background:var(--blue);color:#fff;font-size:17px;font-weight:700;margin-top:22px;cursor:pointer}
button:hover{filter:brightness(.95)} .info{margin-top:18px;background:var(--light);padding:14px;border-radius:14px;text-align:center;font-size:14px}
.footer{text-align:center;color:#66808e;font-size:12px;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <img class="logo" src="logo.png" alt="BATUKARAS MEDIA" onerror="this.style.display='none'">
    <h1>BATUKARAS MEDIA</h1>
    <p class="sub">Reservasi wisata Batukaras — cepat & langsung via WhatsApp</p>

    <form id="booking">
      <label for="nama">Nama</label>
      <input id="nama" required placeholder="Nama lengkap">

      <label for="instagram">Instagram</label>
      <input id="instagram" placeholder="@username">

      <label for="tiktok">TikTok</label>
      <input id="tiktok" placeholder="@username">

      <label for="tanggal">Tanggal</label>
      <input id="tanggal" type="date" required>

      <label for="waktu">Waktu</label>
      <input id="waktu" type="time" required>

      <label for="paket">Paket Wisata</label>
      <select id="paket" required>
        <option value="">Pilih paket wisata</option>
        <option>Jetski — Rp700.000</option>
        <option>Paddleboard Single — Rp300.000</option>
        <option>Green Canyon — Paket Perahu</option>
        <option>Green Canyon — Semi Bodyrafting</option>
        <option>Green Canyon — Bodyrafting Standard</option>
        <option>Freediving</option>
        <option>Paket lainnya</option>
      </select>

      <button type="submit">📲 RESERVASI VIA WHATSAPP</button>
    </form>

    <div class="info">WhatsApp Reservasi: <b>0851-5501-2620</b></div>
  </div>
  <div class="footer">© BATUKARAS MEDIA</div>
</div>

<script>
const phone = "6285155012620";
document.getElementById("booking").addEventListener("submit", function(e){
  e.preventDefault();
  const nama = document.getElementById("nama").value.trim();
  const instagram = document.getElementById("instagram").value.trim() || "-";
  const tiktok = document.getElementById("tiktok").value.trim() || "-";
  const tanggal = document.getElementById("tanggal").value;
  const waktu = document.getElementById("waktu").value;
  const paket = document.getElementById("paket").value;

  const text =
`Halo BATUKARAS MEDIA, saya ingin reservasi wisata.

Nama: ${nama}
Instagram: ${instagram}
TikTok: ${tiktok}
Tanggal: ${tanggal}
Waktu: ${waktu}
Paket Wisata: ${paket}

Mohon informasi ketersediaan dan konfirmasi reservasinya. Terima kasih.`;

  window.location.href = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
});
</script>
</body>
</html>
